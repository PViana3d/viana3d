name: Reencaminhar endereço antigo

# A aplicação é publicada pelo Cloudflare Pages em https://gestao.serras3d.pt (projeto serras3d-gestao).
# O GitHub Pages (https://pviana3d.github.io/viana3d/) fica só a reencaminhar para lá, mantendo o #…
# para as etiquetas QR e os links de orçamentos antigos continuarem a funcionar.

on:
  push:
    branches: [main]
    paths: ['redirect/**', '.github/workflows/publicar.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
