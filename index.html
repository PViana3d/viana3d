<body>
<div id="auth" hidden></div>
<div class="app" id="app">
  <aside class="side">
    <div class="brand"><b id="brandName">Oficina 3D</b><small>Gestão de impressão</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="storeNote"></div>
  </aside>
  <main><div class="wrap" id="view"><div class="loading">A carregar dados…</div></div></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" hidden></div>

<script src="vendor/pocketbase.umd.js?v=__BUILD__"></script>
<script src="vendor/jszip.min.js?v=__BUILD__"></script>
<script src="config.js?v=__BUILD__"></script>
<script src="app.js?v=__BUILD__"></script>
<script>
// instalação como app e atualizações automáticas
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const nw = reg.installing;
      nw && nw.addEventListener('statechange', () => {
        if (nw.state === 'installed' && navigator.serviceWorker.controller) {
          const bar = document.createElement('div');
          bar.className = 'update-bar';
          bar.innerHTML = '<span>Há uma nova versão da aplicação.</span><button class="btn primary" type="button">Atualizar</button>';
          bar.querySelector('button').onclick = () => { nw.postMessage('skip'); };
          document.body.appendChild(bar);
        }
      });
    });
  }).catch(() => {});
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded) { reloaded = true; location.reload(); } });
}
</script>
</body>
</html>
