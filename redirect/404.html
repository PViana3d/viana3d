<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serras3D · Gestão mudou de endereço</title>
<meta name="robots" content="noindex">
<script>
// A aplicação mudou para https://gestao.serras3d.pt — mantém o #… (etiquetas QR, links de orçamentos)
(function(){
  var novo = 'https://gestao.serras3d.pt/' + location.search + location.hash;
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
  location.replace(novo);
})();
</script>
<meta http-equiv="refresh" content="2;url=https://gestao.serras3d.pt/">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0f;color:#f3f1ec;font:16px/1.5 system-ui,sans-serif;padding:24px}
a{color:#f4b04a}
</style>
</head>
<body>
<p>A aplicação mudou para <a href="https://gestao.serras3d.pt/">gestao.serras3d.pt</a>. A abrir…</p>
<script>document.querySelector('a').href = 'https://gestao.serras3d.pt/' + location.search + location.hash;</script>
</body>
</html>
